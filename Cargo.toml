[workspace]
members = ["crates/dot-wire", "crates/dot-guest", "crates/dot-home"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "io-util", "net", "time", "sync", "fs"] }
url = { version = "2", features = ["serde"] }

# Argon2 runs on every sign-in and in tests; unoptimized it takes seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
