# docker compose -f deploy/home/compose.yaml up -d
# Set DOT_HOME_PUBLIC_URL, DOT_HOME_ACME_EMAIL and KVM_GID (getent group kvm | cut -d: -f3) in .env.
# How Gluon shows this app: its name, icon and description.
x-gluon:
  name: Familiar
  description: A Mac for your assistant
  icon: data:image/svg+xml;base64,
services:
  dot-home:
    # Release images carry the update key, so they can update themselves:
    #   image: ghcr.io/<owner>/familiar/dot-home:latest   (or :nightly)
    # A local build works too but never auto-updates.
    build:
      context: ../..
    image: dot-home:latest
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:?set KVM_GID to the host's kvm group id}"
    ports:
      - "443:8443"
    environment:
      DOT_HOME_PUBLIC_URL: "${DOT_HOME_PUBLIC_URL:?set DOT_HOME_PUBLIC_URL, e.g. https://home.example.com}"
      # Set this for built-in Let's Encrypt HTTPS, or leave it empty and set
      # DOT_HOME_TRUSTED_PROXIES to your TLS proxy's address. The server refuses to start
      # with plain HTTP on a public port otherwise.
      DOT_HOME_ACME_EMAIL: "${DOT_HOME_ACME_EMAIL:-}"
      DOT_HOME_TRUSTED_PROXIES: "${DOT_HOME_TRUSTED_PROXIES:-}"
    volumes:
      - dot-home:/var/lib/dot-home
    # Running Macs are hibernated on stop so they resume where they were; give them time.
    stop_grace_period: 5m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    ulimits:
      nofile: 65536
volumes:
  dot-home:
