[package]
name = "dot-home"
version = "0.3.0"
description = "Self-hosted Dot: a private macOS VM per person, driven by their AI assistant over MCP"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dot-home"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
dot-wire = { path = "../dot-wire" }
aead = { version = "0.5", features = ["stream"] }
aes-gcm = "0.10.3"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
fatfs = "0.3"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
mime_guess = "2"
rmcp = { version = "=3.5.1", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["include-exclude"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
bytes = "1"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
web-push-native = { version = "0.5", default-features = false }
reqwest.workspace = true
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http = "1"
nix = { version = "0.30", features = ["fs", "signal", "process", "socket", "uio", "user"] }
rustls-acme = { version = "0.14", default-features = false, features = ["aws-lc-rs", "axum", "tls12", "webpki-roots"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
