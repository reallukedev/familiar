script = '''
ObjC.import('Foundation');
const APP_NAME = 'Calendar';

function fail(code, message) { throw new Error(code + ': ' + message); }
function readArgs(argv) {
  let a;
  try { a = JSON.parse(argv && argv.length ? argv[0] : '{}'); } catch (e) { fail('INVALID_ARGS', 'The arguments are not valid JSON.'); }
  if (a === null || typeof a !== 'object' || Array.isArray(a)) fail('INVALID_ARGS', 'The arguments must be a JSON object.');
  return a;
}
function normalizeError(e) {
  const msg = String((e && e.message) || e);
  if (/^(INVALID_ARGS|NOT_FOUND|PERMISSION_DENIED|FAILED|CONFLICT): /.test(msg)) return e;
  const n = e && e.errorNumber;
  if (n === -1743 || /not authori[sz]ed/i.test(msg)) return new Error('PERMISSION_DENIED: macOS has not allowed control of ' + APP_NAME + '. Allow it in System Settings > Privacy & Security.');
  if (n === -1712) return new Error('FAILED: ' + APP_NAME + ' did not respond in time.');
  if (n === -1728 || n === -1719) return new Error('NOT_FOUND: ' + msg);
  return new Error('FAILED: ' + msg);
}
function isPermission(e) { return e && (e.errorNumber === -1743 || /not authori[sz]ed/i.test(String(e.message))); }
function reqStr(a, k, max) {
  const v = a[k];
  if (typeof v !== 'string' || !v.trim()) fail('INVALID_ARGS', k + ' is required.');
  if (v.length > max) fail('INVALID_ARGS', k + ' is longer than ' + max + ' characters.');
  return v;
}
function iso(d) { return (d instanceof Date && !isNaN(d.getTime())) ? d.toISOString() : null; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function localDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function attempt(fn, fallback) { try { return fn(); } catch (e) { if (isPermission(e)) throw e; return fallback; } }

function findEvent(app, uid) {
  const n = app.calendars.length;
  for (let i = 0; i < n; i++) {
    const cal = app.calendars[i];
    const m = attempt(() => cal.events.whose({ uid: uid }), null);
    if (m && m.length > 0) return { cal, ev: m[0] };
  }
  fail('NOT_FOUND', 'No event has uid “' + uid + '”. It may have been deleted.');
}

function main(args) {
  const uid = reqStr(args, 'uid', 500);
  const app = Application('Calendar');
  const found = findEvent(app, uid);
  const ev = found.ev;
  const st = ev.startDate(), en = ev.endDate();
  const allDay = !!ev.alldayEvent();
  const notes = attempt(() => ev.description(), null);
  const out = {
    uid: ev.uid(),
    calendar: found.cal.name(),
    title: ev.summary() || '',
    start: iso(st),
    end: iso(en),
    all_day: allDay,
    location: attempt(() => ev.location(), null) || null,
    url: attempt(() => ev.url(), null) || null,
    status: attempt(() => ev.status(), null),
    notes: notes ? String(notes).slice(0, 20000) : null,
    notes_truncated: !!(notes && String(notes).length > 20000),
    recurrence: attempt(() => ev.recurrence(), null) || null,
    excluded_dates: attempt(() => (ev.excludedDates() || []).map(iso).filter(Boolean).slice(0, 200), []),
    // Bulk reads over each element list: one Apple Event per property.
    alerts_minutes_before: attempt(() => ev.displayAlarms.triggerInterval().map(m => -m), []),
    attendees: attempt(() => {
      const names = ev.attendees.displayName(), emails = ev.attendees.email(), status = ev.attendees.participationStatus();
      return names.slice(0, 200).map((nm, i) => ({ name: nm || null, email: emails[i] || null, status: status[i] || null }));
    }, []),
    time_zone: $.NSTimeZone.localTimeZone.name.js,
  };
  if (allDay && st instanceof Date && en instanceof Date) {
    out.start_date = localDate(st);
    out.end_date = localDate(new Date(Math.max(st.getTime(), en.getTime() - 1)));
  }
  return JSON.stringify(out);
}

function run(argv) {
  try { return main(readArgs(argv)); } catch (e) { throw normalizeError(e); }
}
