[[tools]]
name = "calendar_create"
title = "Create calendar event"
description = "Create an event. Only when the person asks. Give start and end as RFC 3339 with an offset; end defaults to one hour after start. For an all-day event, set all_day and the dates in start and end (inclusive last day) are used as calendar dates in the Mac's time zone. Returns the new uid."
risk = "write"
language = "javascript"
timeout_s = 45
input_schema = '''
{ "type": "object",
  "properties": {
    "calendar": { "type": "string", "maxLength": 200, "description": "Calendar name or id. Must be writable." },
    "title": { "type": "string", "maxLength": 1000 },
    "start": { "type": "string", "format": "date-time" },
    "end": { "type": "string", "format": "date-time" },
