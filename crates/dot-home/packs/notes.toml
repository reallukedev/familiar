  if (!hits.length) hits = all.filter(f => f.name.toLowerCase() === key.toLowerCase() || f.path.toLowerCase() === key.toLowerCase());
  if (!hits.length) fail('NOT_FOUND', 'No notes folder is named “' + key + '”. Use notes_folders to see the names.');
  if (hits.length > 1) fail('CONFLICT', 'More than one folder is named “' + key + '”. Pass its id or path from notes_folders instead.');
  const target = hits[0];
  app.move(note, { to: target.ref });
  // Moving can give the note a new id (for example across accounts), so look it up again.
  let newId = id;
  try {
    const m = target.ref.notes.whose({ name: name });
    if (m.length === 1) newId = m[0].id();
  } catch (e) { if (isPermission(e)) throw e; }
  return JSON.stringify({ moved: true, id: newId, name, folder: target.path, account: target.account });
}

function run(argv) {
  try { return main(readArgs(argv)); } catch (e) { throw normalizeError(e); }
}
