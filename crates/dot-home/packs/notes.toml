  const n = e && e.errorNumber;
  if (n === -1743 || /not authori[sz]ed/i.test(msg)) return new Error('PERMISSION_DENIED: macOS has not allowed control of ' + APP_NAME + '. Allow it in System Settings > Privacy & Security.');
  if (n === -1712) return new Error('FAILED: ' + APP_NAME + ' did not respond in time.');
  if (n === -1728 || n === -1719) return new Error('NOT_FOUND: ' + msg);
  return new Error('FAILED: ' + msg);
}
function isPermission(e) { return e && (e.errorNumber === -1743 || /not authori[sz]ed/i.test(String(e.message))); }
function iso(d) { return (d instanceof Date && !isNaN(d.getTime())) ? d.toISOString() : null; }

function main(args) {
  const id = args.id;
  if (typeof id !== 'string' || !id.trim() || id.length > 500) fail('INVALID_ARGS', 'id is required.');
  let max = args.max_chars === undefined || args.max_chars === null ? 20000 : args.max_chars;
  if (!Number.isInteger(max) || max < 100 || max > 200000) fail('INVALID_ARGS', 'max_chars must be a whole number from 100 to 200000.');

  const app = Application('Notes');
  const note = app.notes.byId(id);
  let name;
  try { name = note.name(); } catch (e) { if (isPermission(e)) throw e; fail('NOT_FOUND', 'No note has id “' + id + '”. It may have been deleted.'); }
  let locked = false;
  try { locked = !!note.passwordProtected(); } catch (e) { if (isPermission(e)) throw e; }
  if (locked) fail('CONFLICT', 'The note “' + name + '” is locked. Unlock it in Notes first.');
  let folder = null;
  try { folder = note.container().name(); } catch (e) { if (isPermission(e)) throw e; }
  const text = String(note.plaintext() || '');
  let htmlLength = null;
  try { htmlLength = String(note.body() || '').length; } catch (e) { if (isPermission(e)) throw e; }
  let attachments = 0;
  try { attachments = note.attachments.length; } catch (e) { if (isPermission(e)) throw e; }
  return JSON.stringify({
    id, name, folder,
    created: iso(note.creationDate()),
    modified: iso(note.modificationDate()),
    text: text.slice(0, max),
    text_length: text.length,
    truncated: text.length > max,
    html_length: htmlLength,
    attachment_count: attachments,
  });
