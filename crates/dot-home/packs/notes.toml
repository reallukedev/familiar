  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function textToHtml(text) {
  return String(text).replace(/\r\n?/g, '\n').split('\n').map(line => '<div>' + (line ? escapeHtml(line) : '<br>') + '</div>').join('');
}

function walkFolders(app) {
  const out = [];
