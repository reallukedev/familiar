function isPermission(e) { return e && (e.errorNumber === -1743 || /not authori[sz]ed/i.test(String(e.message))); }
function attempt(fn, fallback) { try { return fn(); } catch (e) { if (isPermission(e)) throw e; return fallback; } }

function main(args) {
  const app = Application('Mail');
  // Bulk reads: one Apple Event per property for all accounts.
  const names = app.accounts.name();
  const enabled = attempt(() => app.accounts.enabled(), null);
  const emails = attempt(() => app.accounts.emailAddresses(), null);
  const types = attempt(() => app.accounts.accountType(), null);
