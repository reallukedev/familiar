  if (v.length > max) fail('INVALID_ARGS', k + ' is longer than ' + max + ' characters.');
  return v;
}
function limitArg(a) {
  if (a.limit === undefined || a.limit === null) return 50;
  if (!Number.isInteger(a.limit) || a.limit < 1 || a.limit > 500) fail('INVALID_ARGS', 'limit must be a whole number from 1 to 500.');
  return a.limit;
}
function findAccount(app, key) {
  const names = app.accounts.name();
  let i = names.indexOf(key);
  if (i < 0) i = names.findIndex(n => n.toLowerCase() === key.toLowerCase());
  if (i < 0) fail('NOT_FOUND', 'No Mail account is named “' + key + '”. Use mail_accounts to see the names.');
  return { name: names[i], ref: app.accounts[i] };
