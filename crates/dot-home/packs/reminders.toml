      if (q && ![title[i], body[i]].some(v => v && String(v).toLowerCase().indexOf(q) >= 0)) continue;
      const allDay = allDayDue[i] instanceof Date;
      const dueAt = due[i] instanceof Date ? due[i] : (allDay ? allDayDue[i] : null);
      const notes = body[i] ? String(body[i]) : null;
      const row = {
        id: rid[i],
        list: names[li],
        title: title[i] || '',
        notes: notes ? notes.slice(0, 1000) : null,
        completed: !!done[i],
        due: iso(dueAt),
