  return d;
}
function iso(d) { return (d instanceof Date && !isNaN(d.getTime())) ? d.toISOString() : null; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function localDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function priorityName(p) { if (!p) return 'none'; if (p <= 4) return 'high'; if (p === 5) return 'medium'; return 'low'; }

function main(args) {
  const list = optStr(args, 'list', 200);
  const includeCompleted = args.include_completed === true;
  const dueBefore = dateArg(args, 'due_before');
  const query = optStr(args, 'query', 200);
  const q = query ? query.toLowerCase() : null;
  const limit = limitArg(args);

  const app = Application('Reminders');
  const names = app.lists.name();
  const ids = app.lists.id();
  let picked = names.map((n, i) => i);
  if (list !== null) {
    picked = picked.filter(i => ids[i] === list || names[i] === list);
    if (!picked.length) picked = names.map((n, i) => i).filter(i => names[i].toLowerCase() === list.toLowerCase());
    if (!picked.length) fail('NOT_FOUND', 'No reminder list is named “' + list + '”. Use reminders_lists to see the names.');
  }

  const filter = [];
  if (!includeCompleted) filter.push({ completed: false });
  if (dueBefore) filter.push({ dueDate: { _lessThan: dueBefore } });
